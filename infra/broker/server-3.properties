# ---------------------------------------------------------------------------
# kafka-3 — combined broker + controller (KRaft). See docs/infra.md §3.
# kafka-2 / kafka-3 differ only in node.id, CLIENT port and advertised host.
# ---------------------------------------------------------------------------

# --- KRaft ---
process.roles=broker,controller
node.id=3
controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
controller.listener.names=CONTROLLER
log.dirs=/var/lib/kafka/data

# --- Listeners ---
# CLIENT     : published to the host (Spring Boot, Python)
# INTERNAL   : docker network (inter-broker, kafka-init, kafka-ui)
# CONTROLLER : docker network only, never published
listeners=CLIENT://0.0.0.0:39092,INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=CLIENT://localhost:39092,INTERNAL://kafka-3:9092
listener.security.protocol.map=CLIENT:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL

# --- SASL/SCRAM ---
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
listener.name.client.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# --- Authorization ---
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
# ANONYMOUS = traffic on the PLAINTEXT controller listener (docker-internal only).
# KRaft cannot use SCRAM on the controller listener; see docs/infra.md §3.
super.users=User:admin;User:ANONYMOUS

# --- Durability defaults ---
auto.create.topics.enable=false
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
unclean.leader.election.enable=false

# --- Demo ergonomics ---
group.initial.rebalance.delay.ms=0
num.partitions=3

# --- Quorum stability on a laptop ---
# Defaults (fetch 2 s, election 1 s, session 9 s) caused controller leader flapping when the host
# CPU spiked (CLI JVMs, IDE, browser). Trade-off: a crashed node is detected in ~10-18 s instead of ~2-9 s.
controller.quorum.fetch.timeout.ms=10000
controller.quorum.election.timeout.ms=3000
controller.quorum.request.timeout.ms=5000
broker.session.timeout.ms=18000
